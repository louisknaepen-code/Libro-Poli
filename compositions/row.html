<template>
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }

    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "Cormorant Garamond", "EB Garamond", serif;
      color: #efe6d4;
    }
    #w-stage { position: absolute; inset: 0; }
    #w-ground { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 60% at 50% 42%, #2c1e0c 0%, #140e07 55%, #070504 100%); }
    #w-cold { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 30% 40%, #15110e 0%, #0a0807 60%, #030202 100%); opacity: 0; }
    #w-world { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #w-veins { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
    #w-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%); }
    #w-grain { position: absolute; inset: 0; background: url("assets/img/grain.png"); opacity: 0.07; mix-blend-mode: overlay; }
    .w-line { position: absolute; left: 108px; width: 864px; }
    .q { font-style: italic; font-weight: 500; font-size: 58px; line-height: 1.15; opacity: 0.8; }
    .b { font-weight: 600; font-size: 132px; line-height: 1.0; letter-spacing: -0.01em; }
    .w { display: inline-block; }

    #w-l1 { top: 490px; }
    #w-l1 .b { font-size: 180px; }
    #w-l2 { top: 330px; }
    #w-name { font-weight: 700; font-size: 420px; line-height: 0.9; letter-spacing: -0.03em; transform-origin: 20% 60%; display: inline-block; }
    #w-l2 .q { margin-top: 40px; }
    #w-l3 { top: 400px; }
    #w-l3 .q { margin-bottom: 22px; }
    #w-shade { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>

  <div id="root" data-composition-id="row" data-width="1080" data-height="1350">
    <div id="w-stage">
      <div id="w-ground"></div>
      <div id="w-cold"></div>
      <div id="w-world"><canvas id="w-veins" data-layout-allow-overflow width="1080" height="1350"></canvas></div>
      <div id="w-vignette"></div>
      <div id="w-grain"></div>

      <div id="w-l1" class="w-line clip" data-start="0" data-duration="1.85" data-track-index="1">
        <div class="b"><span class="w">Deberá</span><br /><span class="w">apurarse.</span></div>
      </div>

      <div id="w-l2" class="w-line clip" data-start="1.85" data-duration="3.2" data-track-index="2">
        <div><span id="w-name">Row</span></div>
        <div class="q"><span class="w">tiene</span> <span class="w">intereses</span> <span class="w">distintos</span><br /><span class="w">de</span> <span class="w">los</span> <span class="w">suyos.</span></div>
      </div>

      <div id="w-l3" class="w-line clip" data-start="4.95" data-duration="3.05" data-track-index="1">
        <div class="q"><span class="w">Lo</span> <span class="w">que</span> <span class="w">pase</span> <span class="w">en</span> <span class="w">el</span> <span class="w">este</span></div>
        <div class="b"><span class="w">podría</span> <span class="w">condenar</span></div>
        <div class="b"><span class="w">el</span> <span class="w">destino</span></div>
        <div class="b"><span class="w">de</span> <span class="w">todos.</span></div>
      </div>

      <div id="w-shade"></div>
    </div>
  </div>

  <script>
    (function () {
      const W = 1080, H = 1350;
      const $ = (s) => document.querySelector(s);

      // ---------- The same vein network as relato.html (same seed, same order) ----------
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(20261104);
      const frost = [];
      function grow(list, x, y, ang, steps, step, w, t0, dt, depth) {
        let t = t0;
        for (let i = 0; i < steps; i++) {
          ang += (rnd() - 0.5) * 0.55;
          const nx = x + Math.cos(ang) * step, ny = y + Math.sin(ang) * step;
          list.push({ x1: x, y1: y, x2: nx, y2: ny, w: w, t: t });
          x = nx; y = ny; t += dt;
          if (depth < 3 && rnd() < 0.17) {
            grow(list, x, y, ang + (rnd() < 0.5 ? -1 : 1) * (0.6 + rnd() * 0.6),
              Math.floor(steps * 0.45), step * 0.85, w * 0.62, t, dt * 1.1, depth + 1);
          }
          w *= 0.985;
        }
      }
      function seedEdge(n, fx, fy, baseAng) {
        for (let i = 0; i < n; i++) {
          const p = fx(i, n), q = fy(i, n);
          grow(frost, p, q, baseAng + (rnd() - 0.5) * 0.9, 12 + Math.floor(rnd() * 16), 16,
            1.6 + rnd() * 1.1, -4.0 + rnd() * 9.5, 0.09, 0);
        }
      }
      const jitter = (i, n, span) => ((i + 0.2 + rnd() * 0.6) / n) * span;
      seedEdge(8, () => -12, (i, n) => jitter(i, n, H), 0);
      seedEdge(8, () => W + 12, (i, n) => jitter(i, n, H), Math.PI);
      seedEdge(8, () => W + 340, (i, n) => jitter(i, n, H), Math.PI);
      seedEdge(5, (i, n) => jitter(i, n, W + 320), () => -12, Math.PI / 2);
      seedEdge(5, (i, n) => jitter(i, n, W + 320), () => H + 12, -Math.PI / 2);

      const route = [];
      for (let x = -60; x <= W + 380; x += 8) {
        route.push([x, 960 + 54 * Math.sin(x / 170 + 1.3) + 26 * Math.sin(x / 61 + 0.4)]);
      }
      const nodes = [];
      for (let i = 20; i < route.length; i += 26) nodes.push(i);
      const tribs = [];
      nodes.forEach((ni, k) => {
        const list = [];
        const [x, y] = route[ni];
        grow(list, x, y, (k % 2 ? -1 : 1) * (Math.PI / 2) + (rnd() - 0.5) * 0.8, 6 + Math.floor(rnd() * 6), 14, 1.4, 0, 0.05, 2);
        tribs.push(list);
      });

      // Death: Row's arrival puts the network out, right to left, toward the name.
      const PAN = -320, DIE0 = 1.85, SWEEP = 2.6, FADE = 0.6;
      const die = (x) => DIE0 + SWEEP * (1 - Math.max(0, Math.min(1, (x + PAN) / W)));
      frost.forEach((s) => (s.d = die((s.x1 + s.x2) / 2) + rnd() * 0.35));
      tribs.forEach((list) => list.forEach((s) => (s.d = die((s.x1 + s.x2) / 2) + rnd() * 0.35)));
      const rseg = [];
      for (let i = 1; i < route.length; i++) rseg.push({ a: route[i - 1], b: route[i], d: die(route[i][0]) });

      const clamp = (v) => Math.max(0, Math.min(1, v));
      const GOLD = [222, 168, 78], ASH = [64, 55, 48], BRIGHT = [233, 190, 98];
      const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
      const rgba = (c, a) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
      const ctx = $("#w-veins").getContext("2d");
      ctx.lineCap = "round";

      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        ctx.translate(PAN, 0);
        for (const s of frost) {
          const k = clamp((t - s.d) / FADE);
          ctx.strokeStyle = rgba(mix(GOLD, ASH, k), 0.38 - 0.18 * k);
          ctx.lineWidth = s.w;
          ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
        }
        ctx.lineWidth = 1.4;
        for (const list of tribs) {
          for (const s of list) {
            const k = clamp((t - s.d) / FADE);
            ctx.strokeStyle = rgba(mix(GOLD, ASH, k), 0.8 - 0.55 * k);
            ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
          }
        }
        ctx.lineWidth = 3.2;
        for (const s of rseg) {
          const k = clamp((t - s.d) / FADE);
          ctx.strokeStyle = rgba(mix(BRIGHT, ASH, k), 1 - 0.6 * k);
          ctx.beginPath(); ctx.moveTo(s.a[0], s.a[1]); ctx.lineTo(s.b[0], s.b[1]); ctx.stroke();
        }
        for (const ni of nodes) {
          const [x, y] = route[ni];
          const k = clamp((t - die(x)) / FADE);
          ctx.fillStyle = rgba(mix(BRIGHT, ASH, k), 1 - 0.5 * k);
          ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = rgba(mix(BRIGHT, ASH, k), 0.55 * (1 - k));
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }

      // ---------- Timeline ----------
      const tl = gsap.timeline({ paused: true });
      const out = (sel, at) =>
        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.05 }, at);

      tl.fromTo("#w-world", { scale: 1.06 }, { scale: 1.085, duration: 8, ease: "none" }, 0);
      tl.fromTo("#w-grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "1536px 1024px", duration: 8, ease: "steps(120)" }, 0);

      // Whip in, matching the outgoing whip's direction.
      tl.fromTo("#w-stage", { x: 260, filter: "blur(22px)" }, { x: 0, filter: "blur(0px)", duration: 0.26, ease: "expo.out" }, 0);
      out("#w-l1 .w", 1.5);
      // Dip, then Row slams in and the warmth drains out of the frame.
      tl.fromTo("#w-shade", { opacity: 0 }, { opacity: 0.4, duration: 0.1, ease: "none" }, 1.75);
      tl.set("#w-shade", { opacity: 0 }, 1.85);
      tl.fromTo("#w-cold", { opacity: 0 }, { opacity: 1, duration: 2.6, ease: "power2.inOut" }, 1.85);
      tl.fromTo("#w-name", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "expo.out" }, 1.85);
      tl.fromTo("#w-l2 .q .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 0.8, filter: "blur(0px)", duration: 0.22, ease: "power2.out", stagger: 0.1 }, 2.4);
      tl.to("#w-name", { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 4.75);
      out("#w-l2 .q .w", 4.72);

      // The stakes, from shadow to ivory.
      tl.fromTo("#w-l3 .q .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 0.8, filter: "blur(0px)", duration: 0.22, ease: "power2.out", stagger: 0.09 }, 5.0);
      tl.fromTo("#w-l3 .b .w", { color: "#2a2420" }, { color: "#efe6d4", duration: 0.45, ease: "power2.out", stagger: 0.15 }, 5.55);
      out("#w-l3 .w", 7.4);
      tl.to(["#w-cold", "#w-world"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.45);
      tl.to("#w-ground", { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.45);

      tl.eventCallback("onUpdate", () => draw(tl.time()));
      draw(0);
      window.__timelines["row"] = tl;
    })();
  </script>
</template>
