<!doctype html>
<html lang="es" data-resolution="custom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Tráiler — La Revolución Lufua: Siembra</title>
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #0b0906;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: #0b0906;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="44.5"
      data-motion-blur="on"
      data-width="1080"
      data-height="1350"
    >
      <div id="bg" class="clip" data-start="0" data-duration="44.5" data-track-index="0"></div>

      <div
        id="relato"
        class="clip"
        data-composition-id="relato"
        data-composition-src="compositions/relato.html"
        data-start="0"
        data-duration="23.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 2"
      ></div>

      <div
        id="row"
        class="clip"
        data-composition-id="row"
        data-composition-src="compositions/row.html"
        data-start="23.5"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 3"
      ></div>

      <div
        id="libro"
        class="clip"
        data-composition-id="libro"
        data-composition-src="compositions/libro.html"
        data-start="31.5"
        data-duration="13"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 4"
      ></div>

      <!-- Sound: bundled Pixabay SFX, each placed so its hit lands one frame after its picture. Music is added in Instagram. -->
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="23.37" data-duration="0.5" data-track-index="2" data-volume="0.8"></audio>
      <audio id="sfx-row" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="25.36" data-duration="1.9" data-track-index="3" data-volume="0.45" data-fade-out="0.6"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="28.86" data-duration="3.5" data-track-index="2" data-volume="0.55"></audio>
      <audio id="sfx-seed" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="32.28" data-duration="2.1" data-track-index="3" data-volume="0.5"></audio>
      <audio id="sfx-cover" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="38.35" data-media-start="1.9" data-duration="2.4" data-track-index="2" data-volume="0.7" data-fade-out="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
